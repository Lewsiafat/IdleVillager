# IdleVillager 的 Herdr plugin（實測用原型，尚未發佈）。
# 作用：Herdr 啟動時自動開啟 IdleVillager 選單列 App，也提供手動啟動的 action。
# plugin 本身不畫任何 UI，App 交給 macOS 的 open 指令啟動，不是 Herdr 的子程序。
id = "idlevillager"
name = "IdleVillager"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Launch the IdleVillager menu bar app"
platforms = ["macos"]

# 只有 `herdr plugin install`（從 GitHub 安裝）會執行；`herdr plugin link` 不會。
[[build]]
command = ["sh", "build.sh"]

# Herdr server 啟動且 API socket 就緒後執行一次。launch.sh 啟動 App 後立即結束。
[[startup]]
command = ["sh", "launch.sh"]

[[actions]]
id = "launch"
title = "Launch IdleVillager"
command = ["sh", "launch.sh"]
