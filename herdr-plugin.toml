# IdleVillager 的 Herdr plugin。整個 repo 就是 plugin 根目錄。
# 安裝：herdr plugin install Lewsiafat/IdleVillager（需要 Xcode Command Line Tools）
# 作用：安裝時在本機把原始碼編成 IdleVillager.app；Herdr 啟動時自動開啟這個選單列 App。
# plugin 本身不畫任何 UI，App 交給 macOS 的 open 指令啟動，不是 Herdr 的子程序。
id = "idlevillager"
name = "IdleVillager"
version = "0.2.1"
min_herdr_version = "0.9.5"
description = "Menu bar app showing which Herdr agents are working, waiting for approval, or idle"
platforms = ["macos"]

# 只有 `herdr plugin install` 與 `update` 會執行；`herdr plugin link` 不會。產物在 plugin 根目錄的 dist/。
# 每次安裝都是全新 checkout，建置完就刪掉 .build 快取（約 186 MB）。
[[build]]
command = ["env", "IDLEVILLAGER_CLEAN_BUILD=1", "sh", "distribution/make-app.sh"]

# 建置完立即啟動 App，安裝或更新後不必等下次 Herdr server 啟動。launch.sh 會先結束舊路徑的實例，
# 所以 update 後會直接換成新版。build 階段沒有 HERDR_PLUGIN_ROOT，launch.sh 改用自己的位置推算根目錄。
# 啟動失敗不應讓整個安裝失敗，所以加上 `|| true`。
[[build]]
command = ["sh", "-c", "sh distribution/launch.sh || true"]

# Herdr server 啟動且 API socket 就緒後執行一次。launch.sh 啟動 App 後立即結束。
[[startup]]
command = ["sh", "distribution/launch.sh"]

[[actions]]
id = "launch"
title = "Launch IdleVillager"
command = ["sh", "distribution/launch.sh"]
